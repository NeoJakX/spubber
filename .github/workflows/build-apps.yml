name: Build apps

# Runs on every version tag (v0.1.0, …) and on demand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: spubber-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble release APK (signed with the fixed test key)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Check the APK signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          mv "$APK" spubber-${{ github.ref_name }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spubber-android
          path: spubber-*.apk

  ios:
    name: iOS (simulator build check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator (no signing needed)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: true
          generate_release_notes: true
          files: out/**/*
